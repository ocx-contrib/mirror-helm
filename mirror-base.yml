# Shared base for every spec in this repository (helm).
#
# NOT a spec: it has no name/target/source and is never loaded on its own.
# Everything a package owns — name, target, source, assets, asset_type,
# metadata, catalog, tests, versions, announce, annotations — stays in that
# package's own mirror.yml.
#
# ⚠️ `extends:` is a SHALLOW merge of top-level keys. A spec that sets a key
# below replaces that block OUTRIGHT — there is no per-key merge. `platforms:`
# is where this bites: it carries BOTH the runner matrix and the container
# legs, so a child that restates it to tweak one runner silently drops every
# `containers:` entry. Nothing reds — the legs simply stop existing, and every
# os.features claim in that spec goes back to being merely asserted. Restate
# `platforms:` IN FULL or not at all.

skip_prereleases: true
cascade: true

# Carried over unchanged from the flat spec this repo published before the
# grouped layout. (The wider fleet rule is `build_timestamp: date`, which
# gives every re-publish its own manifest so a cascade re-point cannot orphan
# a digest a consumer's ocx.lock pins. Helm's versions are bare semver, so
# `date` would apply cleanly here — this is a deliberate carry-over, not a
# measurement, and is the one knob to revisit if a re-publish ever needs to
# preserve an older digest.)
build_timestamp: none

# No `verify:` block. `github_asset_digest` is a `github_release`-source
# option and this repo's only package is `url_index`: Helm publishes its
# binaries on the get.helm.sh CDN, and its GitHub releases carry nothing but
# `.asc` / `.sha256sum` sidecars. There is no `checksums_file` to wire either.
# Downloads are HTTPS from the get.helm.sh CDN.

concurrency:
  # Assets are ~15–20 MB tarballs holding one static binary plus its LICENSE
  # and README.
  max_downloads: 8
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

# `off`, and it cannot be otherwise here. Helm's archives wrap their contents
# in a single `<os>-<arch>/` directory, `asset_type.strip_components: 1` drops
# it, and the binary then lands AT the content root — so the metadata PATH
# entry is a bare `${installPath}`. The scan only looks BELOW an entry of the
# form ${installPath}/<dir>, so `auto` or `verify` is rejected at spec load
# with exit 65 ("bin_scan is enabled but … declares no interface-visible
# ${installPath}/<dir> PATH entry"). `off` with a hand-listed `binaries` in
# metadata.json is the blessed shape. A future package here that ships an
# archive with a real bin/ dir should override this to `verify`.
bin_scan: off

# ─── Platform matrix ────────────────────────────────────────────────────────
#
# `os.features` states what an artifact REQUIRES OF THE HOST — it is not a
# label for how it was built. Helm is a pure-Go build: measured 2026-08-01 on
# v4.2.3, both Linux binaries are fully static, no PT_INTERP and no DT_NEEDED
# (evidence above helm/mirror.yml's `assets:`), and get.helm.sh publishes one
# build per arch with no musl/glibc split to choose between. So both Linux
# keys are BARE. Tagging them `+libc.musl` would be a false requirement that
# hid them from every glibc host.
#
# A bare key claims universality, so it must prove it: ubuntu (glibc) + alpine
# (musl) + fedora (different glibc vintage). The alpine leg IS the proof —
# drop it and the universal claim is merely asserted.
#
# A future package here whose libc measurement differs must restate this whole
# block in its own spec — see the shallow-merge warning at the top.
platforms:
  linux/amd64:
    runner: ubuntu-latest
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  linux/arm64:
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer reds the leg up front.
    runner: ubuntu-24.04-arm
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  darwin/amd64:
    # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 — GitHub's
    # native macos-13 Intel pool is exhausted and deadlocks the push job.
    runner: macos-14
    prefix: ["arch", "-x86_64"]
  darwin/arm64:
    runner: macos-14
    shell: bash
  windows/amd64:
    runner: windows-latest
    shell: pwsh
  windows/arm64:
    # Native arm64 Windows runner — the amd64 pool cannot execute an ARM64 PE.
    runner: windows-11-arm
    shell: pwsh
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
    user_id: "227748867204972545"  # pinged in-message on failures
